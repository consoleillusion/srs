name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run audit
      - run: bun run docs:check

      # Generation must be deterministic: a second run finds nothing to change.
      - name: Migrations are deterministic and idempotent
        run: |
          bun run db:generate
          bun run db:generate | tee second.log
          grep -q "No schema changes" second.log

      # Fixtures come from the independent Python reference; they must match it exactly.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Conformance fixtures match their generator
        run: |
          pip install cryptography pynacl
          python3 conformance/tools/generate.py
          git diff --exit-code -- conformance

      - run: bun test
